name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for f in lib/*.js; do node --check "$f"; done

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Publish GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
